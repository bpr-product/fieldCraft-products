plugins {
    id 'java'
}

description = 'FieldCraft Tenant DAL'

group = project.rootProject.group
version = project.rootProject.version

bootJar {
    enabled = false
}

jar {
    enabled = true
}

repositories {
    mavenCentral()
}

dependencies {
    //spring
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.2.0'
    implementation platform('org.mockito:mockito-bom:5.4.0')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
 	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.h2database:h2:2.4.240'

    //Local projects
    implementation project(path: ':shared:fieldcraft-shared-data:fieldcraft-core-data')
    implementation project(path: ':shared:fieldcraft-shared-data:fieldcraft-tenant-data')
    implementation project(path: ':shared:fieldcraft-shared-data:fieldcraft-customer-data')
    implementation project(':shared:fieldcraft-common:fieldcraft-shared')
}
