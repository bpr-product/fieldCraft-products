plugins {
    id 'java'
}

description = 'FieldCraft Tenant-External Services'

group = project.rootProject.group
version = project.rootProject.version

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {   
    //spring 
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    //Local projects
    implementation project (':shared:fieldcraft-saas:fieldcraft-external-service')
}
