# config/environments.prod.yaml
#
# Prod-tier variant of environments.yaml -- same schema, different
# cdc_enabled selection. See docker-compose.prod.yml's
# ENVIRONMENTS_CONFIG_PATH (all prod services point here, not the plain
# environments.yaml used by dev/server, and not environments.nonprod.yaml).
#
# ONLY `prod` is ever cdc_enabled here. Every non-prod source environment
# (dev/si_dev/qa/staging/sandbox/datamart) stays false -- this file, and the
# credentials it resolves via ${ENV_VAR} from this tier's own .env (real
# prod secrets), must never be deployed anywhere but the prod stack.
#
# Credentials are ${ENV_VAR} placeholders resolved from src/datapipeline/.env
# at container start -- no secrets in this file.
#
# Full schema reference: docs/multi-env/configuration_reference.md

tier: prod

environments:

  # ── DATAMART ──────────────────────────────────────────────────────────────
  datamart:
    cdc_enabled: false
    snapshot_mode: never
    source:
      host:         ${DATAMART_PG_HOST}
      port:         5432
      user:         ${DATAMART_PG_USER}
      password:     ${DATAMART_PG_PASSWORD}
      provider_db:  ${DATAMART_PG_DBNAME}
      ssl_mode:     require
    tables:
      columns:
        trade:
          drop: [trade_logo]
        tenant_configuration:
          drop: [data]

  # ── DEV ───────────────────────────────────────────────────────────────────
  dev:
    cdc_enabled: false
    snapshot_mode: initial
    source:
      host:         ${DEV_PG_HOST}
      port:         5432
      user:         ${DEV_PG_USER}
      password:     ${DEV_PG_PASSWORD}
      provider_db:  ${DEV_PG_DBNAME}
      ssl_mode:     require
    tables:
      columns:
        worker:
          drop: [ssn, date_of_birth]

  # ── SI DEV ───────────────────────────────────────────────────────────────
  si_dev:
    cdc_enabled: false
    snapshot_mode: never
    source:
      host:         ${SI_DEV_PG_HOST}
      port:         5432
      user:         ${SI_DEV_PG_USER}
      password:     ${SI_DEV_PG_PASSWORD}
      provider_db:  ${SI_DEV_PG_DBNAME}
      ssl_mode:     require
    tables:
      columns:
        worker:
          drop: [ssn, date_of_birth]

  # ── QA ────────────────────────────────────────────────────────────────────
  qa:
    cdc_enabled: false
    # "when_needed" is documented for some Debezium connectors but is NOT a
    # valid enum value for io.debezium.connector.postgresql.PostgresConnector
    # in the debezium/connect:2.5 image actually deployed here -- Kafka
    # Connect's own config validation rejects it. Use "initial".
    snapshot_mode: initial
    source:
      host:         ${QA_PG_HOST}
      port:         5432
      user:         ${QA_PG_USER}
      password:     ${QA_PG_PASSWORD}
      provider_db:  ${QA_PG_DBNAME}
      ssl_mode:     require
    tables:
      columns:
        worker:
          drop: [ssn, date_of_birth]

  # ── STAGING ───────────────────────────────────────────────────────────────
  staging:
    cdc_enabled: false
    snapshot_mode: initial
    source:
      host:         ${STAGING_PG_HOST}
      port:         5432
      user:         ${STAGING_PG_USER}
      password:     ${STAGING_PG_PASSWORD}
      provider_db:  ${STAGING_PG_DBNAME}
      ssl_mode:     require
    tables:
      # old_task is a per-task VERSION-HISTORY table (every reschedule appends a
      # new row rather than overwriting) -- confirmed live 2026-08-18: ~1.76M
      # rows across 4 tenants on the nonprod staging env, ~71% of that env's
      # entire Silver footprint, and NOT read by any Gold loader/EDEN/BPE/
      # Recommendation code. Excluding it skips it during BOTH the initial
      # Debezium snapshot and ongoing CDC. Dormant here (cdc_enabled: false)
      # but kept consistent with environments.yaml/environments.nonprod.yaml
      # in case this block is ever enabled.
      exclude: [old_task]
      columns:
        worker:
          drop: [ssn, date_of_birth]

  # ── SANDBOX ───────────────────────────────────────────────────────────────
  sandbox:
    cdc_enabled: false
    # See the QA block's comment above -- "when_needed" is rejected by this
    # tier's actual debezium/connect:2.5 image. Use "initial".
    snapshot_mode: initial
    source:
      host:         ${SANDBOX_PG_HOST}
      port:         5432
      user:         ${SANDBOX_PG_USER}
      password:     ${SANDBOX_PG_PASSWORD}
      provider_db:  ${SANDBOX_PG_DBNAME}
      ssl_mode:     require
    tables:
      columns: {}

  # ── PROD ──────────────────────────────────────────────────────────────────
  # The only environment ever enabled on this tier.
  prod:
    cdc_enabled: true
    # "when_needed" is rejected by this tier's actual debezium/connect:2.5
    # image's config validation for the Postgres connector -- see the QA
    # block's comment above. Since this is the only cdc_enabled:true block on
    # this tier, leaving it invalid means CDC never comes up in prod at all.
    snapshot_mode: initial
    source:
      host:         ${PROD_PG_HOST}
      port:         5432
      user:         ${PROD_PG_USER}
      password:     ${PROD_PG_PASSWORD}
      provider_db:  ${PROD_PG_DBNAME}
      ssl_mode:     require
    tables:
      # old_task is a per-task VERSION-HISTORY table (every reschedule appends
      # a new row rather than overwriting) -- confirmed live on nonprod's
      # staging env 2026-08-18: ~1.76M rows across 4 tenants, ~71% of that
      # env's entire Silver footprint, and not read by any Gold loader/EDEN/
      # BPE/Recommendation code. Same schema everywhere, so excluding it here
      # too -- this is the tier's only cdc_enabled block, unlike staging above
      # which is dormant on THIS tier. Skips it during both the initial
      # Debezium snapshot and ongoing CDC.
      exclude: [old_task]
      columns:
        worker:
          drop: [ssn, date_of_birth]
