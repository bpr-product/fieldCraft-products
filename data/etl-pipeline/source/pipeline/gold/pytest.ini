[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: fast tests, no external connections — run on every PR
    integration: require live Silver PostgreSQL + Cosmos DB — run post-merge
    leakage: cross-tenant isolation checks — run nightly
    slow: long-running tests
    bpe: Ball Park Estimate (pricing) Silver → Gold loader tests
    eden: Eden AI Silver → Gold loader tests
    reference_project: Reference Project (qa_recommendation) Silver → Gold loader tests
    ai_assistant: legacy AI Assistant tests (retired feature — quarantined)
    pipeline: orchestration-layer tests (pipeline_runner, tenant_runner, dq gate, retry)
    canonical: Canonical (user_permissions) Silver → Gold loader tests
    monitoring: metrics, freshness, circuit-breaker and contract-validator tests
    audit: gold_audit stream-event recording tests
